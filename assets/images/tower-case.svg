<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Системный блок и монитор, собранные в стол">
  <title>Компьютер для занятий</title>
  <!-- корпус -->
  <path d="M20 30 h96 l16 18 v122 h-112 z" fill="#2b2b2b"/>
  <path d="M20 30 l10 -14 h96 l-10 14 z" fill="#3a3a3a"/>
  <rect x="20" y="48" width="96" height="122" fill="#242424"/>
  <!-- отсеки для дисков -->
  <g fill="#3a3a3a">
    <rect x="30" y="58" width="76" height="20"/>
    <rect x="30" y="84" width="76" height="20"/>
    <rect x="30" y="110" width="76" height="20"/>
  </g>
  <g fill="#d8c9a3"><rect x="34" y="63" width="44" height="4"/><rect x="34" y="89" width="36" height="4"/><rect x="34" y="115" width="52" height="4"/></g>
  <!-- кнопка питания и индикаторы -->
  <circle cx="34" cy="150" r="6" fill="#b7410e"/>
  <circle cx="56" cy="150" r="3.4" fill="#2e7d32"/>
  <!-- вентиляционные прорези -->
  <g fill="#141414">
    <rect x="70" y="143" width="38" height="3"/><rect x="70" y="150" width="38" height="3"/><rect x="70" y="157" width="38" height="3"/>
  </g>
  <!-- подножка -->
  <rect x="12" y="170" width="112" height="10" fill="#1a1a1a"/>
  <!-- монитор справа -->
  <rect x="156" y="46" width="124" height="86" rx="3" fill="#1a1a1a"/>
  <rect x="165" y="55" width="106" height="68" fill="#101413"/>
  <g fill="#2e7d6e">
    <rect x="174" y="66" width="60" height="6"/><rect x="174" y="80" width="82" height="6"/><rect x="174" y="94" width="44" height="6"/>
  </g>
  <rect x="206" y="132" width="24" height="16" fill="#1a1a1a"/>
  <rect x="182" y="148" width="72" height="10" rx="2" fill="#1a1a1a"/>
  <!-- клавиатура -->
  <rect x="170" y="162" width="120" height="16" rx="2" fill="#2b2b2b"/>
  <rect x="252" y="140" width="14" height="20" rx="6" fill="#2b2b2b"/>
</svg>
